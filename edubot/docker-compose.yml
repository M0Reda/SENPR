services:
  # â”€â”€ EduBot Web Application â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  edubot:
    build:
      context: ..
      dockerfile: edubot/Dockerfile
    container_name: edubot-app
    restart: unless-stopped
    ports:
      - "${GRADIO_PORT:-7860}:7860"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - PYTHONUNBUFFERED=1
    volumes:
      - ./chroma_db:/app/edubot/chroma_db
      - ./logs:/app/edubot/logs
      - ../EduBot_Dataset_v1.2:/app/EduBot_Dataset_v1.2:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - edubot-network

  # â”€â”€ Ollama LLM Service â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  ollama:
    image: ollama/ollama:latest
    container_name: edubot-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edubot-network

  # â”€â”€ Automatic Model Puller â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  ollama-init:
    image: ollama/ollama:latest
    container_name: edubot-ollama-init
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo 'Waiting for Ollama service to start...' &&
       until ollama list > /dev/null 2>&1; do sleep 2; done &&
       echo 'Checking and pulling model: '$$MODEL &&
       (ollama show $$MODEL > /dev/null 2>&1 && echo 'Model already installed, skipping pull' || ollama pull $$MODEL) &&
       echo 'Model ready!'"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - edubot-network

networks:
  edubot-network:
    driver: bridge

volumes:
  ollama_models:
    name: edubot_ollama_models
