# ============================================================
# EduBot – Local Academic Advisor Chatbot
# Central configuration – edit here, never in source code.
# ============================================================

# ── Paths ────────────────────────────────────────────────────
data_dir: "../EduBot_Dataset_v1.2"   # relative to the edubot/ root
index_dir: "./chroma_db"
logs_dir:  "./logs"
reports_dir: "./reports"

# ── Ollama / LLM ─────────────────────────────────────────────
ollama_base_url: "http://localhost:11434"
model: "llama3.2:3b"                  # active pulled local model
fallback_model: "llama3.2:3b"         # fallback model
# Temperature: 0 for deterministic tool reasoning; slightly higher for friendly prose
temperature: 0.1
max_tokens: 1024

# ── Embeddings ───────────────────────────────────────────────
embed_model: "all-MiniLM-L6-v2"       # sentence-transformers id
rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# ── Retrieval ────────────────────────────────────────────────
retrieval:
  top_k: 10           # ChromaDB initial fetch
  rerank_top_n: 4     # cross-encoder re-rank top-n
  min_confidence: 0.35  # below this → ask clarifying question

# ── Intent Router ────────────────────────────────────────────
router:
  classifier: "logistic"   # sklearn model type
  threshold: 0.50          # softmax confidence below this → LOW_CONFIDENCE
  max_features: 8000       # TF-IDF vocabulary size

# ── Data Splits ──────────────────────────────────────────────
# We honour the pre-existing 80/10/10 student split from EduBot_Training/
splits:
  seed: 42
  # Derived from EduBot_Training/sft_train.jsonl etc.; do not re-split.
  use_existing: true

# ── LoRA Fine-Tune (optional) ────────────────────────────────
lora:
  enabled: false
  base_model: "unsloth/Qwen2.5-7B-Instruct-bnb-4bit"
  output_dir: "./lora_adapter"
  max_steps: 500
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4

# ── Evaluation ───────────────────────────────────────────────
eval:
  judge_model: "qwen2.5:7b-instruct"   # LLM-as-judge (same Ollama instance)
  n_adversarial: 30                     # adversarial test cases to generate
  n_paraphrase: 50                      # paraphrased hard-test queries

# ── Privacy ──────────────────────────────────────────────────
privacy:
  strip_student_email: true    # never include university_email in LLM context
  never_index: ["Users.csv"]   # files that must never be loaded into the index
